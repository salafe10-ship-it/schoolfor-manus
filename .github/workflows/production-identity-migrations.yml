name: Production identity migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY_PRODUCTION_IDENTITY_MIGRATIONS to authorize the approved identity migration set'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-identity-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply approved identity migrations
    runs-on: ubuntu-latest
    environment: production-database-migrations
    timeout-minutes: 15
    env:
      PLATFORM_ADMIN_DATABASE_URL: ${{ secrets.PLATFORM_ADMIN_DATABASE_URL }}
    steps:
      - name: Checkout selected release
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Require explicit authorization
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          test "$CONFIRMATION" = "APPLY_PRODUCTION_IDENTITY_MIGRATIONS" || {
            echo 'Invalid confirmation; no migration was executed.'
            exit 1
          }
          test -n "$PLATFORM_ADMIN_DATABASE_URL" || {
            echo 'Missing PLATFORM_ADMIN_DATABASE_URL; no migration was executed.'
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Apply identity migrations atomically
        run: npm run db:apply-identity-structure

      - name: Verify identity governance
        run: npm run db:verify-identity-governance
