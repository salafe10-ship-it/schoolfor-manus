name: Cloudflare production uptime

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: schoolfor-manus-cloudflare-uptime
  cancel-in-progress: false

jobs:
  school-gateway:
    name: Probe shared school gateway
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATEWAY_URL: ${{ vars.CLOUDFLARE_SCHOOL_GATEWAY_URL || 'https://abdalsalamsoft.com' }}
      SCHOOL_CONTEXT: ${{ vars.CLOUDFLARE_SCHOOL_GATEWAY_CONTEXT || 'modern-family-schools' }}
      EXPECTED_SCHOOL_ID: ${{ vars.CLOUDFLARE_SCHOOL_GATEWAY_ID || 'be687819-4d8d-427f-8479-81c0b70c35e1' }}
    steps:
      - name: Check gateway health, assets, and school identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 "$GATEWAY_URL/api/health" | jq -e '.success == true' >/dev/null
          curl --fail --silent --show-error --retry 3 --max-time 20 --get --data-urlencode "school=$SCHOOL_CONTEXT" "$GATEWAY_URL/api/public/school-portal" | jq -e --arg expected "$EXPECTED_SCHOOL_ID" '.success == true and .school.id == $expected' >/dev/null
          curl --fail --silent --show-error --retry 3 --max-time 20 "$GATEWAY_URL/" -o "$RUNNER_TEMP/gateway-index.html"
          asset="$(grep -oE '/assets/[^" ]+\.(js|css)' "$RUNNER_TEMP/gateway-index.html" | head -n 1 || true)"
          test -n "$asset" || { echo 'Gateway asset reference missing'; exit 1; }
          curl --fail --silent --show-error --retry 3 --max-time 20 "$GATEWAY_URL$asset" -o /dev/null

  probe:
    name: Probe Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_URL: ${{ vars.CLOUDFLARE_PRODUCTION_URL || 'https://schoolfor-manus.salafe10.workers.dev' }}
      PUBLIC_PRODUCTION_URL: ${{ vars.CLOUDFLARE_PUBLIC_PRODUCTION_URL || 'https://modern-family-schools.abdalsalamsoft.com' }}
    steps:
      - name: Check health, HTML, and first asset
        id: readiness
        shell: bash
        run: |
          set -u
          state="failed"
          reason="health endpoint unreachable"

          for attempt in 1 2 3 4 5; do
            health_status="$(curl --silent --show-error --location --max-time 20 --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' "$PRODUCTION_URL/api/health" || true)"
            if [ "$health_status" != "200" ]; then
              reason="health HTTP ${health_status:-unreachable}"
            elif ! jq -e '.success == true and (.data.build.commit | type == "string" and test("^[0-9a-fA-F]{40}$")) and (.data.build.builtAt | type == "string" and length > 0)' "$RUNNER_TEMP/health.json" >/dev/null 2>&1; then
              reason="health payload invalid"
            else
              index_status="$(curl --silent --show-error --location --max-time 20 --output "$RUNNER_TEMP/index.html" --write-out '%{http_code}' "$PRODUCTION_URL/" || true)"
              asset="$(grep -oE '/assets/[^" ]+\.(js|css)' "$RUNNER_TEMP/index.html" 2>/dev/null | head -n 1 || true)"
              if [ "$index_status" != "200" ]; then
                reason="index HTTP ${index_status:-unreachable}"
              elif [ -z "$asset" ]; then
                reason="index asset reference missing"
              else
                asset_status="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL$asset" || true)"
                if [ "$asset_status" = "200" ]; then
                  state="healthy"
                  reason="health, index, and asset are responding"
                  break
                fi
                reason="asset HTTP ${asset_status:-unreachable}"
              fi
            fi

            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Check the public school domain and asset path
        id: public_readiness
        shell: bash
        run: |
          set -u
          state="failed"
          reason="public health endpoint unreachable"

          for attempt in 1 2 3 4 5; do
            health_status="$(curl --silent --show-error --location --max-time 20 --output "$RUNNER_TEMP/public-health.json" --write-out '%{http_code}' "$PUBLIC_PRODUCTION_URL/api/health" || true)"
            if [ "$health_status" != "200" ]; then
              reason="public health HTTP ${health_status:-unreachable}"
            elif ! jq -e '.success == true' "$RUNNER_TEMP/public-health.json" >/dev/null 2>&1; then
              reason="public health payload invalid"
            else
              index_status="$(curl --silent --show-error --location --max-time 20 --output "$RUNNER_TEMP/public-index.html" --write-out '%{http_code}' "$PUBLIC_PRODUCTION_URL/" || true)"
              asset="$(grep -oE '/assets/[^" ]+\.(js|css)' "$RUNNER_TEMP/public-index.html" 2>/dev/null | head -n 1 || true)"
              if [ "$index_status" != "200" ]; then
                reason="public index HTTP ${index_status:-unreachable}"
              elif [ -z "$asset" ]; then
                reason="public index asset reference missing"
              else
                asset_status="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$PUBLIC_PRODUCTION_URL$asset" || true)"
                if [ "$asset_status" = "200" ]; then
                  state="healthy"
                  reason="public health, index, and asset are responding"
                  break
                fi
                reason="public asset HTTP ${asset_status:-unreachable}"
              fi
            fi

            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Open or update production outage alert
        if: steps.readiness.outputs.state == 'failed' || steps.public_readiness.outputs.state == 'failed'
        uses: actions/github-script@v7
        env:
          WORKER_FAILURE_REASON: ${{ steps.readiness.outputs.reason }}
          PUBLIC_FAILURE_REASON: ${{ steps.public_readiness.outputs.reason }}
        with:
          script: |
            const marker = '<!-- schoolfor-manus-cloudflare-production-uptime -->';
            const title = 'Cloudflare production readiness check failed';
            const failures = [process.env.WORKER_FAILURE_REASON, process.env.PUBLIC_FAILURE_REASON].filter((reason) => reason && !reason.includes('responding'));
            const body = `The production Worker or public school domain failed its health, HTML, or asset check: \`${failures.join('; ') || 'readiness check failed'}\`.\n\n${marker}`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find((issue) => issue.title === title && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Still failing at ${new Date().toISOString()}: \`${failures.join('; ') || 'readiness check failed'}\`.` });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close recovered production outage alert
        if: steps.readiness.outputs.state == 'healthy' && steps.public_readiness.outputs.state == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- schoolfor-manus-cloudflare-production-uptime -->';
            const title = 'Cloudflare production readiness check failed';
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            for (const issue of issues.filter((item) => item.title === title && item.body?.includes(marker))) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Recovered at ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
